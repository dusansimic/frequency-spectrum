<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Radio Frequency Spectrum Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --surface:#0a0a0a;
    --line:#1f1f1f;
    --muted:#6b6b6b;
    --fg:#f0f0f0;
    --orange:#ff6b00;
    --orange-dim:#cc5500;
    --orange-bright:#ff8a3d;
    --red:#ff3b30;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--fg);min-height:100%}
  body{
    font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:13px;
    line-height:1.5;
    padding:32px 20px;
  }
  .wrap{max-width:1100px;margin:0 auto}

  .frame{
    border:1px solid var(--line);
    padding:0;
    margin-bottom:20px;
    position:relative;
  }
  .frame-title{
    position:absolute;
    top:-8px;left:16px;
    background:var(--bg);
    padding:0 8px;
    font-size:11px;
    letter-spacing:.2em;
    color:var(--orange);
    text-transform:uppercase;
  }
  .frame-body{padding:28px 20px 20px}

  h1{
    font-size:13px;
    letter-spacing:.25em;
    font-weight:500;
    text-transform:uppercase;
    color:var(--orange);
  }
  .sub{color:var(--muted);font-size:11px;letter-spacing:.1em;margin-top:4px}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}

  .field label{display:block;font-size:10px;letter-spacing:.2em;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
  .field .prompt{display:flex;align-items:center;border:1px solid var(--line);background:#050505}
  .field .prompt::before{content:'>';padding:0 8px;color:var(--orange);font-weight:700}
  input,select{
    flex:1;
    background:transparent;
    border:0;
    padding:10px 8px 10px 0;
    color:var(--fg);
    font-family:inherit;
    font-size:13px;
    outline:none;
  }
  select{padding-right:8px;cursor:pointer;appearance:none}
  .field .prompt:focus-within{border-color:var(--orange)}

  button,.btn{
    font-family:inherit;
    font-size:12px;
    letter-spacing:.15em;
    text-transform:uppercase;
    background:transparent;
    color:var(--fg);
    border:1px solid var(--line);
    padding:10px 16px;
    cursor:pointer;
    transition:color .15s,border-color .15s,background .15s;
  }
  button:hover,.btn:hover{color:var(--orange);border-color:var(--orange)}
  button.primary{color:var(--orange);border-color:var(--orange)}
  button.primary:hover{background:var(--orange);color:#000}
  button.danger:hover{color:var(--red);border-color:var(--red)}

  .actions{display:flex;gap:10px;flex-wrap:wrap}

  #overlapWarning:not(:empty){
    border:1px solid var(--red);
    border-left-width:3px;
    padding:12px 16px;
    margin-bottom:20px;
    font-size:12px;
    color:#ffb3ae;
  }
  #overlapWarning strong{color:var(--red);display:block;margin-bottom:6px;letter-spacing:.15em}
  #overlapWarning div{color:var(--muted);font-size:11px;margin-top:3px}

  .freq-row{
    display:grid;
    grid-template-columns:32px 1fr auto auto auto;
    align-items:center;
    gap:16px;
    padding:12px 4px;
    border-bottom:1px dashed var(--line);
    font-size:12px;
  }
  .freq-row .rm{justify-self:end;margin-left:8px}
  .freq-row:last-child{border-bottom:0}
  .freq-row .idx{color:var(--muted);font-size:11px}
  .freq-row .name{color:var(--fg);letter-spacing:.05em}
  .freq-row .meta{color:var(--orange);font-variant-numeric:tabular-nums;font-weight:500}
  .freq-row .mode{color:var(--muted);font-size:10px;letter-spacing:.2em;border:1px solid var(--line);padding:2px 6px}
  .freq-row.is-overlap .name{color:var(--red)}
  .freq-row .rm{
    background:transparent;border:0;color:var(--muted);cursor:pointer;
    font-family:inherit;font-size:14px;padding:4px 8px;
  }
  .freq-row .rm:hover{color:var(--red)}

  .empty{color:var(--muted);font-size:11px;letter-spacing:.15em;padding:24px 4px;text-align:center}

  canvas{display:block;width:100%;max-width:100%;background:#000}
  .canvas-wrap{overflow-x:auto}

  footer{color:var(--muted);font-size:10px;letter-spacing:.2em;text-align:center;margin-top:32px;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <div class="frame">
    <div class="frame-title">unit</div>
    <div class="frame-body">
      <h1>Mobile Radio Spectrum Analyzer</h1>
      <div class="sub">fm / 446.000 &mdash; 446.200 mhz &mdash; 12.5 / 25 khz</div>
    </div>
  </div>

  <div class="frame">
    <div class="frame-title">input</div>
    <div class="frame-body">
      <div class="grid">
        <div class="field">
          <label>name</label>
          <div class="prompt"><input type="text" id="name" placeholder="channel 1"></div>
        </div>
        <div class="field">
          <label>freq mhz</label>
          <div class="prompt"><input type="number" id="frequency" step="0.00625" min="400" max="500" placeholder="446.00625"></div>
        </div>
        <div class="field">
          <label>bandwidth</label>
          <div class="prompt">
            <select id="bandwidth">
              <option value="12.5">narrow 12.5 khz</option>
              <option value="25">wide 25 khz</option>
            </select>
          </div>
        </div>
        <div class="field" style="display:flex;align-items:flex-end">
          <button class="primary" onclick="addFrequency()" style="width:100%">[ add ]</button>
        </div>
      </div>
    </div>
  </div>

  <div id="overlapWarning"></div>

  <div class="frame">
    <div class="frame-title">channels</div>
    <div class="frame-body">
      <div id="frequencyList"></div>
    </div>
  </div>

  <div class="frame">
    <div class="frame-title">spectrum</div>
    <div class="frame-body">
      <div class="canvas-wrap">
        <canvas id="spectrumChart"></canvas>
      </div>
    </div>
  </div>

  <div class="actions">
    <button onclick="exportJSON()">[ export ]</button>
    <button onclick="document.getElementById('importFile').click()">[ import ]</button>
    <button class="danger" onclick="clearAll()">[ clear ]</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>

  <footer>end of line</footer>
</div>

<script>
let frequencies=[];

window.onload=function(){
  const saved=localStorage.getItem('frequencies');
  if(saved){
    const parsed=JSON.parse(saved);
    frequencies=parsed.map(f=>(f.id!==undefined&&f.bandwidth!==undefined)
      ?{_id:f.id,name:f.name||'Unnamed',frequency:mhzToHz(f.frequency),mode:khzToMode(f.bandwidth)}
      :f);
    saveData();
  }
  updateDisplay();
};

function mhzToHz(m){return Math.round(m*1000000)}
function hzToMhz(h){return h/1000000}
function modeToKhz(m){return m==='FM'?25:12.5}
function khzToMode(k){return k===25?'FM':'NFM'}

function addFrequency(){
  const nI=document.getElementById('name');
  const fI=document.getElementById('frequency');
  const bI=document.getElementById('bandwidth');
  const fm=parseFloat(fI.value);
  const bw=parseFloat(bI.value);
  if(!fm||isNaN(fm)){alert('Enter a valid frequency');return}
  frequencies.push({
    _id:Date.now(),
    name:nI.value.trim()||`Frequency ${frequencies.length+1}`,
    frequency:mhzToHz(fm),
    mode:khzToMode(bw)
  });
  saveData();updateDisplay();
  nI.value='';fI.value='';
}

function removeFrequency(id){
  frequencies=frequencies.filter(f=>f._id!==id);
  saveData();updateDisplay();
}

function saveData(){localStorage.setItem('frequencies',JSON.stringify(frequencies))}

function updateDisplay(){updateFrequencyList();drawSpectrum();checkOverlaps()}

function getOverlapSet(){
  const s=new Set(),eps=1e-6;
  for(let i=0;i<frequencies.length;i++)for(let j=i+1;j<frequencies.length;j++){
    const a=frequencies[i],b=frequencies[j];
    const af=hzToMhz(a.frequency),bf=hzToMhz(b.frequency);
    const aw=modeToKhz(a.mode)/2000,bw=modeToKhz(b.mode)/2000;
    if((af+aw>bf-bw+eps)&&(bf+bw>af-aw+eps)){s.add(a._id);s.add(b._id)}
  }
  return s;
}

function checkOverlaps(){
  const c=document.getElementById('overlapWarning');
  const o=[],eps=1e-6;
  for(let i=0;i<frequencies.length;i++)for(let j=i+1;j<frequencies.length;j++){
    const a=frequencies[i],b=frequencies[j];
    const af=hzToMhz(a.frequency),bf=hzToMhz(b.frequency);
    const ab=modeToKhz(a.mode),bb=modeToKhz(b.mode);
    const min1=af-ab/2000,max1=af+ab/2000,min2=bf-bb/2000,max2=bf+bb/2000;
    if((max1>min2+eps)&&(max2>min1+eps)){
      o.push({n1:a.name||'Unnamed',n2:b.name||'Unnamed',f1:af,f2:bf,b1:ab,b2:bb});
    }
  }
  c.innerHTML=o.length?`<strong>! overlap detected</strong>${o.map(x=>`<div>&middot; ${x.n1} (${x.f1.toFixed(5)} / ${x.b1} khz) ↔ ${x.n2} (${x.f2.toFixed(5)} / ${x.b2} khz)</div>`).join('')}`:'';
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(frequencies,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='frequencies.json';a.click();
  URL.revokeObjectURL(url);
}

function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const imp=JSON.parse(ev.target.result);
      if(Array.isArray(imp)){
        frequencies=imp.map(f=>(f.id!==undefined&&f.bandwidth!==undefined)
          ?{_id:f.id,name:f.name||'Unnamed',frequency:mhzToHz(f.frequency),mode:khzToMode(f.bandwidth)}
          :f);
        saveData();updateDisplay();
        alert('Imported successfully');
      }else alert('Invalid JSON format');
    }catch(err){alert('Error: '+err.message)}
  };
  r.readAsText(file);
  e.target.value='';
}

function clearAll(){
  if(confirm('Clear all frequencies?')){frequencies=[];saveData();updateDisplay()}
}

document.addEventListener('DOMContentLoaded',()=>{
  ['name','frequency'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('keypress',e=>{if(e.key==='Enter')addFrequency()});
  });
});

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function updateFrequencyList(){
  const c=document.getElementById('frequencyList');
  if(frequencies.length===0){c.innerHTML='<div class="empty">&gt; no channels // add one above</div>';return}
  const overlap=getOverlapSet();
  const sorted=[...frequencies].sort((a,b)=>a.frequency-b.frequency);
  c.innerHTML=sorted.map((f,i)=>{
    const fm=hzToMhz(f.frequency);
    const bw=modeToKhz(f.mode);
    const lo=(fm-bw/2000).toFixed(5),hi=(fm+bw/2000).toFixed(5);
    const isO=overlap.has(f._id);
    return `<div class="freq-row ${isO?'is-overlap':''}">
      <span class="idx">${String(i+1).padStart(2,'0')}</span>
      <span class="name">${escapeHtml(f.name||'Unnamed')} <span style="color:var(--muted);font-size:10px;margin-left:6px">${lo}&nbsp;&rarr;&nbsp;${hi}</span></span>
      <span class="meta">${fm.toFixed(5)} mhz</span>
      <span class="mode">${f.mode==='FM'?'wide':'narrow'}</span>
      <button class="rm" onclick="removeFrequency(${f._id})" title="remove">&times;</button>
    </div>`;
  }).join('');
}

function drawSpectrum(){
  const canvas=document.getElementById('spectrumChart');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;

  const drawSize=(w,h)=>{
    canvas.width=w*dpr;canvas.height=h*dpr;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);
  };

  if(frequencies.length===0){
    drawSize(1000,180);
    ctx.fillStyle='#000';ctx.fillRect(0,0,1000,180);
    ctx.strokeStyle='#1f1f1f';ctx.lineWidth=1;
    for(let i=0;i<=10;i++){const x=50+(900/10)*i;ctx.beginPath();ctx.moveTo(x,30);ctx.lineTo(x,150);ctx.stroke()}
    ctx.fillStyle='#6b6b6b';ctx.font='11px "JetBrains Mono",monospace';ctx.textAlign='center';
    ctx.fillText('> NO SIGNAL',500,95);
    return;
  }

  const barH=38,barS=10,pad=50;
  const w=1000;
  const h=Math.max(260,frequencies.length*(barH+barS)-barS+2*pad+30);
  drawSize(w,h);

  ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);

  const all=frequencies.map(f=>{const fm=hzToMhz(f.frequency),bw=modeToKhz(f.mode)/2000;return{min:fm-bw,max:fm+bw}});
  const minF=Math.min(...all.map(a=>a.min)),maxF=Math.max(...all.map(a=>a.max));
  const range=maxF-minF,p=range*0.1||0.01;
  const dMin=minF-p,dMax=maxF+p,dR=dMax-dMin;
  const cw=w-2*pad,ch=h-2*pad-20;

  ctx.strokeStyle='#1f1f1f';ctx.lineWidth=1;
  for(let i=0;i<=10;i++){
    const x=pad+(cw/10)*i;
    ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,pad+ch);ctx.stroke();
  }

  const overlap=getOverlapSet();
  const sorted=[...frequencies].sort((a,b)=>a.frequency-b.frequency);

  sorted.forEach((f,i)=>{
    const fm=hzToMhz(f.frequency),bw=modeToKhz(f.mode)/2000;
    const x1=pad+((fm-bw-dMin)/dR)*cw;
    const x2=pad+((fm+bw-dMin)/dR)*cw;
    const width=Math.max(2,x2-x1);
    const y=pad+i*(barH+barS);
    const isO=overlap.has(f._id);

    ctx.fillStyle=isO?'#ff3b30':'#ff6b00';
    ctx.fillRect(x1,y,width,barH);

    const cx=pad+((fm-dMin)/dR)*cw;
    ctx.strokeStyle='rgba(0,0,0,0.5)';
    ctx.lineWidth=1;ctx.setLineDash([2,2]);
    ctx.beginPath();ctx.moveTo(cx,y+3);ctx.lineTo(cx,y+barH-3);ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle='#000';
    ctx.font='700 10px "JetBrains Mono",monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    const name=(f.name||'Unnamed').toUpperCase();
    const lbl=`${name}  ${fm.toFixed(5)}  ${modeToKhz(f.mode)}K`;
    if(width>120)ctx.fillText(lbl,cx,y+barH/2);
    else if(width>60)ctx.fillText(fm.toFixed(4),cx,y+barH/2);
  });

  ctx.strokeStyle='#6b6b6b';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad,pad+ch);ctx.lineTo(pad+cw,pad+ch);ctx.stroke();

  ctx.fillStyle='#6b6b6b';ctx.font='10px "JetBrains Mono",monospace';
  ctx.textAlign='center';ctx.textBaseline='top';
  for(let i=0;i<=10;i++){
    const freq=dMin+(dR/10)*i;
    const x=pad+(cw/10)*i;
    ctx.fillText(freq.toFixed(5),x,pad+ch+6);
    ctx.strokeStyle='#6b6b6b';ctx.beginPath();ctx.moveTo(x,pad+ch);ctx.lineTo(x,pad+ch+3);ctx.stroke();
  }
  ctx.fillStyle='#ff6b00';ctx.font='10px "JetBrains Mono",monospace';
  ctx.fillText('FREQ / MHZ',w/2,h-14);
}
</script>
</body>
</html>
